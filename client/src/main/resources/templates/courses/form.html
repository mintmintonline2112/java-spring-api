<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${course.id == null ? 'Thêm môn học' : 'Sửa môn học'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 640px">
    <h3 th:text="${course.id == null ? 'Thêm môn học' : 'Sửa môn học'}"></h3>
    <p class="text-muted">Sinh viên: <strong th:text="${student.name}"></strong></p>

    <form class="card card-body" th:action="@{/students/{sid}/courses/save(sid=${student.id})}"
          th:object="${course}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Tên môn học <span class="text-danger">*</span></label>
            <input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Điểm (0 - 10) <span class="text-danger">*</span></label>
            <input type="number" step="0.1" class="form-control" th:field="*{score}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{score}"></div>
        </div>

        <div>
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a class="btn btn-secondary" th:href="@{/students/{id}(id=${student.id})}">Hủy</a>
        </div>
    </form>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
