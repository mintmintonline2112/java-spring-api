# MySQL dùng bản cài sẵn trên máy (Laragon, port 3306, user root, không mật khẩu).
# Container kết nối tới máy host qua host.docker.internal.
services:
  api:
    build: ./api
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/APIDB?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
    ports:
      - "8080:8080"

  client:
    build: ./client
    restart: on-failure
    environment:
      API_BASE_URL: http://api:8080/api
    ports:
      - "8081:8081"
    depends_on:
      - api
